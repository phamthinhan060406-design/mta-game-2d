<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đồ án 2D - Né và Bắn Vật Thể</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>TƯƠNG TÁC ĐỐI TƯỢNG 2D</h1>
    <div class="hud">
      <span>Điểm: <strong id="score">0</strong></span>
      <span>Kỷ lục: <strong id="bestScore">0</strong></span>
    </div>
    <canvas id="gameCanvas" width="480" height="600"></canvas>
    <div id="overlay" class="overlay">
      <p id="statusText">Dùng ◀ ▶ / A / D di chuyển, Space để bắn</p>
      <button id="startBtn" type="button">Bắt đầu chơi</button>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
